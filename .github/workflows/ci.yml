name: CI PIPELINE

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
          cache:  'npm'
      - run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Upload coverage report
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build: 
    name: Build verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image from Dockerfile in project root (.)
        run: docker build -t cicd-express-demo:${{ github.sha }} .

  quality-gate:
    name: Quality gate
    needs:  [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run:  echo "✅ Lint, tests, and build all passed — safe to merge!"